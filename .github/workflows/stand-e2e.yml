name: AckiVault local stand

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stand-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
      - name: Fetch pinned AVM SDK release
        run: |
          mkdir -p .tools/release
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            --output .tools/release/avm-sdk-linux-x86_64.tar.gz \
            https://github.com/gosh-sh/avm-sdk/releases/download/avm-dev-06e96ef71006-sdk-0748f4f0767a/avm-sdk-linux-x86_64.tar.gz
          printf '%s  %s\n' \
            '8728497cf1e476d3d770a09b19929f7c196f2637654642727432b4c285c85143' \
            '.tools/release/avm-sdk-linux-x86_64.tar.gz' | sha256sum --check
          tar -xzf .tools/release/avm-sdk-linux-x86_64.tar.gz -C .tools/release
          cd .tools/release/avm-sdk-linux-x86_64
          sha256sum --check SHA256SUMS
          jq -e '.schema == "gosh.avm-sdk.release.v2" and
            .sdk_commit == "0748f4f0767a26da8bc363bcb6b5585539d6970e" and
            .ackinacki_commit == "06e96ef71006cca020575cbf35e6b82cc82a324e" and
            .release_tag == "avm-dev-06e96ef71006-sdk-0748f4f0767a" and
            .bundle_version == "0.2.0" and .guest_version == "0.1.1" and
            .rust_toolchain == "1.93.0"' BUILD-MANIFEST.json
          printf '%s  %s\n' \
            "$(jq -er .wasmtime_profile_sha256 BUILD-MANIFEST.json)" \
            'profiles/wasmtime-release-profile.v1' \
            "$(jq -er .runtime_lock_sha256 BUILD-MANIFEST.json)" \
            'provenance/runtime.Cargo.lock' | sha256sum --check
      - name: Test and build contract
        env:
          PROPTEST_CASES: '1024'
          PROPTEST_RNG_SEED: '20261013'
        run: |
          cargo fmt --manifest-path contract/Cargo.toml --check
          cargo test --manifest-path contract/Cargo.toml --locked
          cargo clippy --manifest-path contract/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings
          cargo fmt --manifest-path tests/stand/receipt/Cargo.toml --check
          cargo test --manifest-path tests/stand/receipt/Cargo.toml --locked
          cargo clippy --manifest-path tests/stand/receipt/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings
          .tools/release/avm-sdk-linux-x86_64/bin/avm-contract-build build --manifest-path contract/Cargo.toml
          .tools/release/avm-sdk-linux-x86_64/bin/avm-contract-build build --manifest-path tests/stand/receipt/Cargo.toml
          sha256sum contract/target/avm/contract.wasm contract/target/avm/contract.acab contract/target/avm/contract.descriptor > .tools/vault-first.sha256
          sha256sum tests/stand/receipt/target/avm/contract.wasm tests/stand/receipt/target/avm/contract.acab tests/stand/receipt/target/avm/contract.descriptor > .tools/receipt-first.sha256
          cargo clean --manifest-path contract/Cargo.toml
          cargo clean --manifest-path tests/stand/receipt/Cargo.toml
          .tools/release/avm-sdk-linux-x86_64/bin/avm-contract-build build --manifest-path contract/Cargo.toml
          .tools/release/avm-sdk-linux-x86_64/bin/avm-contract-build build --manifest-path tests/stand/receipt/Cargo.toml
          sha256sum --check .tools/vault-first.sha256
          sha256sum --check .tools/receipt-first.sha256
          rustc --edition=2021 tools/check-abi-ids.rs -o .tools/check-abi-ids
          .tools/check-abi-ids contract/target/avm/contract.acab
          git diff --exit-code -- contract/Cargo.lock tests/stand/receipt/Cargo.lock
      - name: Deploy and replay in native stand
        run: |
          bash scripts/stand-e2e.sh \
            .tools/release/avm-sdk-linux-x86_64 \
            contract/target/avm \
            tests/stand/receipt/target/avm \
            .stand/native
      - name: Prepare ephemeral HTTPS authentication fixture
        run: bash scripts/prepare-console-test-ca.sh .tools/console-test-ca
      - name: Verify console on native stand and recorded evidence
        working-directory: console
        env:
          ACKIVAULT_EVIDENCE_DIR: ../.stand/native
          ACKIVAULT_SDK_ROOT: ../.tools/release/avm-sdk-linux-x86_64
          ACKIVAULT_VAULT_ARTIFACTS: ../contract/target/avm
          ACKIVAULT_RECEIPT_ARTIFACTS: ../tests/stand/receipt/target/avm
          ACKIVAULT_CONSOLE_STATE: ../.stand/console
          ACKIVAULT_SOURCE_COMMIT: ${{ github.sha }}
          ACKIVAULT_TEST_CA_DIR: ${{ github.workspace }}/.tools/console-test-ca
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.tools/console-test-ca/ca.pem
        run: |
          npm ci
          npm run build
          npm test
          npm run test:native
          npm run test:hosted
          npm run test:hosted-native
          npx --no-install playwright install --with-deps chromium
          npm run test:browser
      - name: Upload stand diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stand-diagnostics
          path: |
            .tools/release/avm-sdk-linux-x86_64/BUILD-MANIFEST.json
            .tools/release/avm-sdk-linux-x86_64/profiles/wasmtime-release-profile.v1
            contract/target/avm-build-provenance.txt
            tests/stand/receipt/target/avm-build-provenance.txt
            contract/tests/*.proptest-regressions
            .stand/native/*.json
            .stand/console/session-*/*.json
            .stand/console/receipt-loss-*/executed-payment.json
            .stand/console/receipt-loss-*/verified-recipient.json
            .stand/console/zero-reserve-*/first-payment.json
            .stand/console/zero-reserve-*/rejected-payment.json
            .stand/console/zero-reserve-*/verified-vault.json
            .stand/console/zero-reserve-*/verified-recipient.json
            .stand/console/rejected-delivery-*/before-vault.json
            .stand/console/rejected-delivery-*/dispatched-payment.json
            .stand/console/rejected-delivery-*/verified-vault.json
            .stand/console/rejected-delivery-*/verified-recipient.json
            .stand/console/rejected-delivery-*/execution-counts.json
            .stand/console/hosted-expiry-*/session-*/*-call.json
          if-no-files-found: ignore
