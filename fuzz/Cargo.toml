[package]
name = "ackivault-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
ackivault = { path = "../contract" }
avm-contract-sdk = { git = "https://github.com/gosh-sh/avm-sdk.git", rev = "0748f4f0767a26da8bc363bcb6b5585539d6970e" }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "state_init"
path = "fuzz_targets/state_init.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical_message"
path = "fuzz_targets/canonical_message.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
